[project]
name = "rostelecom-parser"
version = "0.1.0"
description = "Парсер тарифов интернет-провайдера RialCom"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13.4,<5",
    "openpyxl>=3.1.5,<4",
    "playwright>=1.60,<2",
]

[project.scripts]
rialcom-parser = "rialcom_parser.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2",
    "pytest>=8.4.1,<9",
    "ruff>=0.12.5,<0.13",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
